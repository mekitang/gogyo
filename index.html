<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>큰빛 학생 프로그램</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--ink:#1d2433;--mute:#667085;--line:#e2e5ee;--pri:#3b5bdb;--pri-soft:#edf0ff;--ok:#2b8a3e;--ok-soft:#e9f7ec;--warn:#c92a2a;--warn-soft:#fdecec;--amber:#b36b00;--amber-soft:#fff4e0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.55;font-size:15px}
header.top{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header.top h1{font-size:17px;margin:0;flex:1}
main{max-width:1080px;margin:0 auto;padding:20px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.card h2{margin:0 0 6px;font-size:18px}
.sub{color:var(--mute);font-size:13px;margin:0 0 14px}
button,.btn{font:inherit;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;cursor:pointer;color:var(--ink)}
button:hover{background:#f1f3f9}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
button.pri:hover{background:#2f49b8}
button.sm{padding:4px 10px;font-size:13px}
button.danger{color:var(--warn);border-color:#f3c4c4}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;color:var(--ink);width:100%}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;min-height:220px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1;min-width:180px}
.steps{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.steps span{padding:6px 12px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:13px;color:var(--mute)}
.steps span.on{background:var(--pri);border-color:var(--pri);color:#fff}
.steps span.done{background:var(--pri-soft);border-color:#c9d3ff;color:var(--pri)}
.rank{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rank b{width:64px;color:var(--pri)}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button.on{background:var(--pri-soft);border-color:var(--pri);color:var(--pri);font-weight:600}
.sem{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.sem>h3{margin:0;padding:9px 14px;background:#f8f9fc;font-size:14px;border-bottom:1px solid var(--line)}
.sem .body{padding:12px 14px}
.fixed{color:var(--mute);font-size:13px;margin-bottom:10px}
.slot{margin-bottom:12px}
.slot .hd{font-weight:600;font-size:14px;margin-bottom:6px}
.slot .hd small{font-weight:400;color:var(--mute);margin-left:6px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);border-radius:9px;padding:7px 12px;cursor:pointer;background:#fff;font-size:14px;user-select:none}
.opt.on{background:var(--pri-soft);border-color:var(--pri);color:var(--pri);font-weight:600}
.opt .k{font-size:11px;color:var(--mute);margin-left:5px}
.opt.on .k{color:var(--pri)}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-amber{background:var(--amber-soft);color:var(--amber)}
.b-gray{background:#eef0f5;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:#f8f9fc;font-weight:600}
td .tag{display:inline-block;margin:2px 4px 2px 0;padding:1px 8px;border-radius:6px;background:#f1f3f9;font-size:13px}
td .tag.common{background:var(--pri-soft);color:var(--pri);font-weight:600}
.note{font-size:12.5px;color:var(--mute)}
.msg{padding:10px 14px;border-radius:10px;margin:8px 0;font-size:14px}
.msg.warn{background:var(--warn-soft);color:var(--warn)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.msg.info{background:var(--pri-soft);color:#2a3f9e}
.home{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.home .card{cursor:pointer}
.home .card:hover{border-color:var(--pri)}
.bar{height:8px;background:#eceff6;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri)}
.printonly{display:none}
.modal{position:fixed;inset:0;background:rgba(20,24,40,.5);z-index:50;overflow:auto;padding:20px 12px}
.modal-in{max-width:900px;margin:0 auto;background:#fff;border-radius:14px;padding:16px 20px}
.ed-row{display:grid;grid-template-columns:1fr 86px 76px 34px;gap:6px;margin-bottom:6px}
.ed-row input,.ed-row select,.slothd input,.slothd select{padding:6px 8px}
.slotbox{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px;background:#fcfcfe}
.slothd{display:grid;grid-template-columns:1fr 120px 130px 34px;gap:8px;align-items:center;margin-bottom:8px}
.chk{display:flex;align-items:center;gap:6px;white-space:nowrap}
.chk input{width:auto}
.opt .k.k-j{color:#1c7ed6}.opt .k.k-y{color:#2b8a3e}.opt .k.k-c{color:#868e96}
@media(max-width:640px){.ed-row{grid-template-columns:1fr 70px 60px 30px}.slothd{grid-template-columns:1fr 100px 30px}.slothd [data-sum]{display:none}}
.pdfbox .card{border:none;padding:0;margin:0 0 10px;border-radius:0}
details{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px;background:#fff}
summary{cursor:pointer;font-weight:600}
@media print{
  header.top,.steps,.noprint,button{display:none!important}
  body{background:#fff}
  main{padding:0;max-width:none}
  .card{border:none;padding:0;margin-bottom:14px;break-inside:avoid}
  .printonly{display:block}
  th{background:#f0f0f0!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:6px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px 20px;text-align:center;cursor:pointer}
.pcard:hover{border-color:var(--pri);box-shadow:0 2px 10px rgba(59,91,219,.12)}
.pcard h2{margin:0 0 6px;font-size:21px}
.pcard p{margin:0 0 14px;color:var(--mute);font-size:13.5px}
textarea.wr{font-family:inherit;font-size:15px;min-height:140px;line-height:1.65}
.cnt{text-align:right;font-size:12px;color:var(--mute);margin-top:2px}
.fr{display:flex;gap:6px;margin-bottom:6px}
.fr input{flex:1}
.rtit{font-size:22px;text-align:center;margin:0 0 12px}
.rtxt{margin:0 0 6px;white-space:pre-wrap;word-break:break-all;line-height:1.7}
.rsec h3{font-size:16px;margin:16px 0 6px;padding-bottom:4px;border-bottom:2px solid #3b5bdb}
.rsec h4{font-size:14px;margin:12px 0 4px;color:#3b5bdb}
.rsec .para{margin:0 0 4px;white-space:pre-wrap;word-break:break-all;line-height:1.7;font-size:14px}
.rsec .blank{color:#aaa}
.imgs{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.imgs img{height:240px;border:1px solid var(--line);border-radius:6px;background:#fff}
.sticky-save{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:14px 0 6px}
.fbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:6px}
.fbar>div{flex:1;min-width:130px}
@media(max-width:640px){main{padding:14px 12px 80px}.card{padding:16px}header.top{padding:10px 12px}header.top h1{font-size:15px}}
</style>
</head>
<body>
<header class="top">
  <h1 id="ttl">큰빛 학생 프로그램</h1>
  <span id="saveBadge" class="badge b-gray noprint" style="display:none"></span>
  <span id="modeBadge" class="badge b-gray noprint"></span>
  <span id="verBadge" class="note noprint"></span>
  <button id="homeBtn" class="sm" data-act="go-home">처음으로</button>
</header>
<main id="app"></main>

<script>
/* =========================================================
   설정 영역
   - firebase: Firebase 콘솔에서 복사한 웹앱 설정 객체를 붙여넣으면
     Firestore 저장 + 관리자 로그인(이메일/비밀번호)이 켜집니다.
     null이면 이 브라우저에만 저장되는 체험(로컬) 모드로 동작합니다.
   - 학생 화면에는 로그인이 없습니다. 관리자 화면만 로그인으로 보호됩니다.
   Firestore 보안 규칙은 배포 꾸러미의 firestore.rules.template을 사용하세요.
   ========================================================= */
/* 버전 기록
   v1.0 학생·관리자 화면, Firebase 저장
   v1.1 이름·학교·학번 입력, 관리자 PDF 다운로드
   v1.2 학기별 택N 편제표 입력, 세부 지역·전국 지원 체크, 편제표 파일 자동 입력
   v1.3 첫 화면 관리자 버튼 축소
   v1.4 반·번호 드롭다운, 학교·반별 PDF 합본/ZIP/명단 CSV
   v1.5 명단 CSV 선택과목 학기별 칸 분리
   v1.6 서버 연결 실패 시 제출 차단
   v2.0 첫 화면에서 탐구보고서·고교학점제 선택(학생 로그인 없음), 탐구보고서 작성 마법사(서론·본론·결론·자기평가서),
        고교학점제: 시·군·구 세부 지역, 희망고 3순위를 첫 화면에 입력, 자유선택(학기별 교과명 직접 입력),
        모든 단계 기기 자동 저장·이어쓰기, PDF·이미지(사진첩) 저장, 관리자 필터 검색·다운로드(두 프로그램),
        관리자 암호는 소스에 두지 않고 처음 사용 시 설정 */
const APP_VERSION = "v2.0";
const CFG = {
  firebase: null,
  /* 예) firebase: { apiKey:"...", authDomain:"...", projectId:"...", appId:"..." }, */
};

/* ---------- 유틸 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const SEMS = ["1-1","1-2","2-1","2-2","3-1","3-2"];
const semLabel = k => k.replace("-", "학년 ") + "학기";

/* ---------- 저장소 (Firestore 또는 localStorage) ---------- */
const mem = {};
const store = {
  fs: null, auth: null, mode: "local",
  async init() {
    if (!CFG.firebase) return;
    const base = "https://www.gstatic.com/firebasejs/10.12.2/";
    for (const f of ["firebase-app-compat.js", "firebase-auth-compat.js", "firebase-firestore-compat.js"]) {
      await new Promise((ok, no) => { const s = document.createElement("script"); s.src = base + f; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
    }
    firebase.initializeApp(CFG.firebase);
    this.fs = firebase.firestore(); this.auth = firebase.auth(); this.mode = "firebase";
  },
  _read(col) { try { return JSON.parse(localStorage.getItem("hs_" + col) || "[]"); } catch (e) { return mem[col] || []; } },
  _write(col, arr) { mem[col] = arr; try { localStorage.setItem("hs_" + col, JSON.stringify(arr)); } catch (e) {} },
  async list(col) {
    if (this.fs) { const s = await this.fs.collection(col).get(); return s.docs.map(d => ({ id: d.id, ...d.data() })); }
    return this._read(col);
  },
  async set(col, obj) {
    obj.id = obj.id || uid();
    if (this.fs) await this.fs.collection(col).doc(obj.id).set(obj);
    else { const a = this._read(col).filter(x => x.id !== obj.id); a.push(obj); this._write(col, a); }
    return obj.id;
  },
  async del(col, id) {
    if (this.fs) await this.fs.collection(col).doc(id).delete();
    else this._write(col, this._read(col).filter(x => x.id !== id));
  }
};

/* ---------- 지역 (시·도 → 시·군·구) ---------- */
const SIDO_FULL = {"서울":"서울특별시","부산":"부산광역시","대구":"대구광역시","인천":"인천광역시","광주":"광주광역시","대전":"대전광역시","울산":"울산광역시","세종":"세종특별자치시","경기":"경기도","강원":"강원특별자치도","충북":"충청북도","충남":"충청남도","전북":"전북특별자치도","전남":"전라남도","경북":"경상북도","경남":"경상남도","제주":"제주특별자치도"};
const SIDO = Object.keys(SIDO_FULL);
/* 일반구가 있는 시는 '시[구|구]' 형태로 적으면 시와 구가 모두 목록에 들어갑니다 */
const SG_RAW = {
  "서울":"종로구,중구,용산구,성동구,광진구,동대문구,중랑구,성북구,강북구,도봉구,노원구,은평구,서대문구,마포구,양천구,강서구,구로구,금천구,영등포구,동작구,관악구,서초구,강남구,송파구,강동구",
  "부산":"중구,서구,동구,영도구,부산진구,동래구,남구,북구,해운대구,사하구,금정구,강서구,연제구,수영구,사상구,기장군",
  "대구":"중구,동구,서구,남구,북구,수성구,달서구,달성군,군위군",
  "인천":"중구,동구,미추홀구,연수구,남동구,부평구,계양구,서구,강화군,옹진군",
  "광주":"동구,서구,남구,북구,광산구",
  "대전":"동구,중구,서구,유성구,대덕구",
  "울산":"중구,남구,동구,북구,울주군",
  "세종":"세종시",
  "경기":"수원시[장안구|권선구|팔달구|영통구],성남시[수정구|중원구|분당구],의정부시,안양시[만안구|동안구],부천시,광명시,평택시,동두천시,안산시[상록구|단원구],고양시[덕양구|일산동구|일산서구],과천시,구리시,남양주시,오산시,시흥시,군포시,의왕시,하남시,용인시[처인구|기흥구|수지구],파주시,이천시,안성시,김포시,화성시,광주시,양주시,포천시,여주시,연천군,가평군,양평군",
  "강원":"춘천시,원주시,강릉시,동해시,태백시,속초시,삼척시,홍천군,횡성군,영월군,평창군,정선군,철원군,화천군,양구군,인제군,고성군,양양군",
  "충북":"청주시[상당구|서원구|흥덕구|청원구],충주시,제천시,보은군,옥천군,영동군,증평군,진천군,괴산군,음성군,단양군",
  "충남":"천안시[동남구|서북구],공주시,보령시,아산시,서산시,논산시,계룡시,당진시,금산군,부여군,서천군,청양군,홍성군,예산군,태안군",
  "전북":"전주시[완산구|덕진구],군산시,익산시,정읍시,남원시,김제시,완주군,진안군,무주군,장수군,임실군,순창군,고창군,부안군",
  "전남":"목포시,여수시,순천시,나주시,광양시,담양군,곡성군,구례군,고흥군,보성군,화순군,장흥군,강진군,해남군,영암군,무안군,함평군,영광군,장성군,완도군,진도군,신안군",
  "경북":"포항시[남구|북구],경주시,김천시,안동시,구미시,영주시,영천시,상주시,문경시,경산시,의성군,청송군,영양군,영덕군,청도군,고령군,성주군,칠곡군,예천군,봉화군,울진군,울릉군",
  "경남":"창원시[의창구|성산구|마산합포구|마산회원구|진해구],진주시,통영시,사천시,김해시,밀양시,거제시,양산시,의령군,함안군,창녕군,고성군,남해군,하동군,산청군,함양군,거창군,합천군",
  "제주":"제주시,서귀포시"
};
const SG = {};
Object.entries(SG_RAW).forEach(([k, v]) => {
  const out = [];
  (v.match(/[^,\[]+(\[[^\]]*\])?/g) || []).forEach(t => {
    const m = t.match(/^([^\[]+)\[(.*)\]$/);
    if (m) { out.push(m[1]); m[2].split("|").forEach(g => out.push(m[1] + " " + g)); } else out.push(t);
  });
  SG[k] = out;
});
const sgOf = sido => SG[sido] || [];

const sfx = x => String(x || "").replace(/\s/g, "").replace(/(특별자치시|특별시|광역시|시|군|구)$/, "");
function guMatch(a, b) {
  a = String(a || "").replace(/\s/g, ""); b = String(b || "").replace(/\s/g, "");
  if (!a || !b) return false;
  const sa = sfx(a), sb = sfx(b);
  if (sa === sb) return true;
  const pre = (long, short) => long.startsWith(short) && /^(시|군|구)/.test(long.slice(short.length));
  return pre(a, sb) || pre(b, sa);
}

/* ---------- 편제표 텍스트 형식 파서 ---------- */
/* 고정 2-1 | 문학 | 4 | 일반
   선택 2-1 | 학생선택 | 5 | 물리학:3:일반, 화학:3:일반, 심리학:3:진로   (택5) */
function parseSpec(text) {
  const fixed = [], slots = [], errs = [];
  text.split("\n").forEach((raw, i) => {
    const line = raw.trim();
    if (!line || line.startsWith("//") || line.startsWith("#")) return;
    const p = line.split("|").map(x => x.trim());
    const [kind, sem] = (p[0] || "").split(/\s+/);
    if (!SEMS.includes(sem)) { errs.push(`${i + 1}행: 학년-학기(예: 2-1)를 확인하세요.`); return; }
    const [g, s] = sem.split("-").map(Number);
    if (kind === "고정") {
      const cr = parseFloat(p[2]);
      if (!p[1] || isNaN(cr)) { errs.push(`${i + 1}행: 고정 과목은 '고정 2-1 | 과목명 | 학점 | 유형' 형식입니다.`); return; }
      fixed.push({ g, s, name: p[1], credits: cr, kind: KINDS.includes(p[3]) ? p[3] : "" });
    } else if (kind === "선택") {
      const pick = parseInt(p[2]);
      const opts = (p[3] || "").split(",").map(x => x.trim()).filter(Boolean).map(x => {
        const [name, cr, k] = x.split(":").map(y => y.trim());
        return { name, credits: parseFloat(cr), kind: k || "" };
      });
      if (!p[1] || !pick || !opts.length || opts.some(o => !o.name || isNaN(o.credits))) {
        errs.push(`${i + 1}행: 선택군은 '선택 2-1 | 선택군명 | 택할개수 | 과목:학점:유형, ...' 형식입니다.`); return;
      }
      slots.push({ g, s, label: p[1], pick, options: opts });
    } else errs.push(`${i + 1}행: 줄 맨 앞은 '고정' 또는 '선택'이어야 합니다.`);
  });
  return { fixed, slots, errs };
}
function toSpec(sc) {
  const out = [];
  SEMS.forEach(k => {
    const [g, s] = k.split("-").map(Number);
    (sc.fixed || []).filter(f => f.g === g && f.s === s).forEach(f => out.push(`고정 ${k} | ${f.name} | ${f.credits}${f.kind ? " | " + f.kind : ""}`));
    (sc.slots || []).filter(f => f.g === g && f.s === s).forEach(f =>
      out.push(`선택 ${k} | ${f.label} | ${f.pick} | ` + f.options.map(o => `${o.name}:${o.credits}${o.kind ? ":" + o.kind : ""}`).join(", ")));
  });
  return out.join("\n");
}
/* 택N 선택군의 학점 범위 */
function slotRange(sl) {
  const c = (sl.options || []).map(o => +o.credits || 0).sort((a, b) => a - b);
  const n = Math.min(+sl.pick || 0, c.length);
  return [c.slice(0, n).reduce((a, b) => a + b, 0), c.slice(c.length - n).reduce((a, b) => a + b, 0)];
}

function selSet(id, idx) { S.sel[id] = S.sel[id] || {}; S.sel[id][idx] = S.sel[id][idx] || []; return S.sel[id][idx]; }
function calc(sc) {
  const fixedCr = (sc.fixed || []).reduce((a, f) => a + f.credits, 0);
  let selCr = 0; const issues = []; const chosen = [];
  (sc.slots || []).forEach((sl, i) => {
    const picked = (S.sel[sc.id]?.[i] || []).map(n => sl.options.find(o => o.name === n)).filter(Boolean);
    selCr += picked.reduce((a, o) => a + o.credits, 0);
    picked.forEach(o => chosen.push({ ...o, g: sl.g, s: sl.s, slot: sl.label }));
    if (picked.length < sl.pick) issues.push(`${sl.g}학년 ${sl.s}학기 ${sl.label}: ${sl.pick - picked.length}과목 더 선택해야 합니다.`);
  });
  const act = sc.activityCredits ?? 18;
  const total = fixedCr + selCr + act;
  const need = sc.totalCredits ?? 192;
  return { fixedCr, selCr, act, total, need, diff: total - need, issues, chosen, done: issues.length === 0 };
}
function careerHits(sc) {
  const map = parseCareers(S.careersText);
  const kw = map[S.stu.track] || [];
  if (!kw.length) return null;
  const c = calc(sc);
  const hit = o => kw.some(k => o.name.includes(k));
  const matched = c.chosen.filter(hit);
  const missed = [];
  (sc.slots || []).forEach((sl, i) => {
    const sel = S.sel[sc.id]?.[i] || [];
    sl.options.filter(o => hit(o) && !sel.includes(o.name)).forEach(o => missed.push({ ...o, g: sl.g, s: sl.s, slot: sl.label }));
  });
  const totalHit = (sc.slots || []).reduce((a, sl) => a + sl.options.filter(hit).length, 0);
  return { matched, missed, kw, totalHit };
}

async function sha(s) {

}

function newEdit() { return { name: "", type: "일반고", sido: "", sigungu: "", nationwide: false, totalCredits: 192, activityCredits: 18, fixed: [], slots: [], semTab: "2-1", mode: "form", bulk: null, spec: "", aiMsg: "" }; }
function semCreditText(E, k) {
  const [g, s] = k.split("-").map(Number);
  const fx = E.fixed.filter(f => f.g === g && f.s === s).reduce((a, f) => a + (+f.credits || 0), 0);
  let mn = 0, mx = 0; E.slots.filter(x => x.g === g && x.s === s).forEach(x => { const r = slotRange(x); mn += r[0]; mx += r[1]; });
  return fmtR([fx + mn, fx + mx]) + "학점";
}
function edStats(E) {
  const fixed = E.fixed.reduce((a, f) => a + (+f.credits || 0), 0);
  let mn = 0, mx = 0; E.slots.forEach(x => { const r = slotRange(x); mn += r[0]; mx += r[1]; });
  const act = +E.activityCredits || 0, need = +E.totalCredits || 0;
  const errs = [];
  const emptyNames = E.fixed.filter(f => !String(f.name).trim()).length + E.slots.reduce((a, x) => a + x.options.filter(o => !String(o.name).trim()).length, 0);
  if (emptyNames) errs.push(`과목명이 비어 있는 칸이 ${emptyNames}곳 있습니다.`);
  const badCr = E.fixed.filter(f => !(+f.credits > 0)).length + E.slots.reduce((a, x) => a + x.options.filter(o => !(+o.credits > 0)).length, 0);
  if (badCr) errs.push(`학점이 비어 있거나 0인 칸이 ${badCr}곳 있습니다.`);
  E.slots.forEach(x => {
    const lb = `${x.g}학년 ${x.s}학기 '${x.label}'`;
    if (!x.options.length) errs.push(`${lb}에 과목이 없습니다.`);
    else if (!(+x.pick >= 1)) errs.push(`${lb}의 '택N'이 1 이상이어야 합니다.`);
    else if (+x.pick > x.options.length) errs.push(`${lb}: 택${x.pick}인데 과목이 ${x.options.length}개뿐입니다.`);
  });
  const lo = fixed + mn + act, hi = fixed + mx + act;
  const okTotal = need >= lo && need <= hi;
  const state = okTotal ? " — 목표 이수학점과 맞습니다." : ` — 목표(${need})보다 ${lo > need ? (lo - need) + "학점 많습니다" : (need - hi) + "학점 모자랍니다"}. 빠진 과목이나 학점 입력을 확인하세요.`;
  return { errs, lo, hi, cls: errs.length ? "warn" : okTotal ? "ok" : "info",
    html: `고정 ${fixed} + 선택 ${fmtR([mn, mx])} + 창체 ${act} = <b>${fmtR([lo, hi])}학점</b> / 목표 ${need}학점${state}${errs.length ? "<br>" + errs.map(esc).join("<br>") : ""}` };
}

const AI_PROMPT = `이 문서는 한국 고등학교의 2022 개정 교육과정 '교육과정 편성표'입니다. 표를 읽어 아래 JSON 하나만 출력하세요. 설명과 마크다운 코드블록은 쓰지 마세요.
{"name":"학교명","type":"일반고|자율형공립고|자율형사립고|특목고|특성화고|마이스터고|기타","totalCredits":192,"activityCredits":18,
 "stated":{"subjectTotal":174,"activityTotal":18,"total":192},
 "fixed":[{"g":1,"s":1,"name":"공통국어1","credits":4,"kind":"공통"}],
 "slots":[{"g":2,"s":1,"label":"학생선택","pick":5,"options":[{"name":"물리학","credits":3,"kind":"일반"}]}]}
규칙:
1. g는 학년(1~3), s는 학기(1~2)입니다. 표의 학기 열에서 숫자가 적힌 칸으로 판단하세요.
2. credits는 '기준학점'이 아니라 학기 열에 적힌 이수 학점(운영학점)입니다.
3. 학교지정(필수) 과목은 fixed에, 학생선택 과목은 '택N' 묶음마다 slot 하나로 넣고 pick에는 N을 적습니다. 같은 택N 묶음의 과목은 모두 그 slot의 options입니다.
4. 택N 묶음이 학기별로 따로 있으면 학기마다 slot을 나누세요.
5. kind는 표에 적힌 공통/일반/진로/융합을 그대로 쓰고, 표기가 없으면 빈 문자열로 둡니다.
6. 창의적 체험활동, 추가교육과정, 학교 밖 교육 과목은 fixed와 slots에 넣지 말고 activityCredits와 stated에만 반영하세요.
7. 과목명은 표기 그대로 적고 Ⅰ, Ⅱ 같은 기호도 유지하세요.
8. 표의 교과 합계, 창체 합계, 총 합계는 stated에 적으세요.`;
async function fileToBlock(file) {
  const b64 = buf => { let t = ""; const u = new Uint8Array(buf); for (let i = 0; i < u.length; i += 0x8000) t += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(t); };
  if (file.type === "application/pdf" || /\.pdf$/i.test(file.name)) return { type: "document", source: { type: "base64", media_type: "application/pdf", data: b64(await file.arrayBuffer()) } };
  const url = URL.createObjectURL(file);
  const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
  const sc = Math.min(1, 3200 / Math.max(img.width, img.height));
  if (sc === 1 && file.size < 4.5e6 && /^image\/(png|jpe?g|webp)$/.test(file.type)) return { type: "image", source: { type: "base64", media_type: file.type, data: b64(await file.arrayBuffer()) } };
  const c = document.createElement("canvas"); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return { type: "image", source: { type: "base64", media_type: "image/jpeg", data: c.toDataURL("image/jpeg", 0.9).split(",")[1] } };
}
async function aiExtract() {
  const E = S.admin.edit, file = $("#aiFile").files[0], key = $("#aiKey").value.trim(), model = $("#aiModel").value.trim() || "claude-sonnet-5-5";
  const st = $("#aiStatus"), btn = $("#aiBtn");
  if (!file) { alert("편제표 PDF 또는 이미지를 먼저 선택하세요."); return; }
  if (!key) { alert("Anthropic API 키를 입력하세요."); return; }
  try { localStorage.setItem("hs_aikey", key); localStorage.setItem("hs_aimodel", model); } catch (_) {}
  btn.disabled = true; st.textContent = "파일을 읽는 중입니다. 1~3분 걸릴 수 있습니다…";
  try {
    const block = await fileToBlock(file);
    const res = await fetch("https://api.anthropic.com/v1/messages", { method: "POST",
      headers: { "content-type": "application/json", "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({ model, max_tokens: 16000, messages: [{ role: "user", content: [block, { type: "text", text: AI_PROMPT }] }] }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data?.error?.message || res.status);
    const txt = (data.content || []).filter(c => c.type === "text").map(c => c.text).join("");
    const j = JSON.parse(txt.slice(txt.indexOf("{"), txt.lastIndexOf("}") + 1));
    const norm = o => ({ name: String(o.name || "").trim(), credits: +o.credits || 0, kind: KINDS.includes(o.kind) ? o.kind : "" });
    E.fixed = (j.fixed || []).filter(f => SEMS.includes(f.g + "-" + f.s)).map(f => ({ g: +f.g, s: +f.s, ...norm(f) }));
    E.slots = (j.slots || []).filter(x => SEMS.includes(x.g + "-" + x.s)).map(x => ({ g: +x.g, s: +x.s, label: String(x.label || "학생선택"), pick: +x.pick || 1, options: (x.options || []).map(norm) }));
    if (j.name && !E.name.trim()) E.name = j.name;
    if (TYPES.includes(j.type)) E.type = j.type;
    if (+j.totalCredits) E.totalCredits = +j.totalCredits;
    if (j.activityCredits != null) E.activityCredits = +j.activityCredits || 0;
    const stt = edStats(E), sd = j.stated || {};
    const calcSubj = fmtR([stt.lo - (+E.activityCredits || 0), stt.hi - (+E.activityCredits || 0)]);
    const mism = sd.subjectTotal && !(sd.subjectTotal >= stt.lo - (+E.activityCredits || 0) && sd.subjectTotal <= stt.hi - (+E.activityCredits || 0));
    E.aiMsg = `읽기 완료: 고정 ${E.fixed.length}과목, 선택군 ${E.slots.length}개(선택 과목 ${E.slots.reduce((a, x) => a + x.options.length, 0)}개). 읽은 교과 학점 ${calcSubj}` + (sd.subjectTotal ? ` / 문서 표기 교과 합계 ${sd.subjectTotal}학점${mism ? " → 차이가 있으니 빠지거나 잘못 읽은 과목이 없는지 확인하세요." : " → 일치합니다."}` : "") + " 아래 입력표에서 학기별 과목과 학점을 원본과 대조한 뒤 저장하세요.";
    E.semTab = "2-1"; E.mode = "form";
  } catch (err) {
    st.textContent = "읽기에 실패했습니다: " + err.message; btn.disabled = false; return;
  }
  render();
}

function csvOf(items) {
  const picksOf = o => (o && o.picks) || [];

    for (let i = 1; i <= 3; i++) {

const LIB = { h2p: "https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js", pdflib: "https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js", jszip: "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" };
function loadScript(src, test) {
  return new Promise((ok, no) => { if (test && test()) return ok(); const el = document.createElement("script"); el.src = src; el.onload = ok; el.onerror = () => no(new Error("라이브러리를 불러오지 못했습니다: " + src)); document.head.appendChild(el); });
}
function saveBlob(blob, name) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
async function mergePdfs(blobs) {
  await loadScript(LIB.pdflib, () => window.PDFLib);
  const out = await PDFLib.PDFDocument.create();
  for (const b of blobs) { const src = await PDFLib.PDFDocument.load(await b.arrayBuffer()); (await out.copyPages(src, src.getPageIndices())).forEach(p => out.addPage(p)); }

}
const jobHtml = ctx => ctx.html ? ctx.html() : withCtx(ctx, resultHTML);
/* 학생 한 명씩 PDF·이미지를 만드는 작업 공간. 화면을 흰 막으로 덮고 진행 상황을 보여 줍니다. */
async function pdfSession(fn) {
  const wrap = document.createElement("div");
  wrap.style.cssText = "position:fixed;inset:0;z-index:9999;background:#fff;overflow:auto;padding:16px";
  wrap.innerHTML = '<p style="text-align:center;color:#3b5bdb;font-weight:600">파일을 만드는 중입니다…</p>';
  const box = document.createElement("div");
  box.style.cssText = "width:700px;margin:0 auto;background:#fff;color:#1d2433"; box.className = "pdfbox";
  wrap.appendChild(box); document.body.appendChild(wrap);
  const prog = t => { wrap.firstChild.textContent = t; };
  try {
    await loadScript(LIB.h2p, () => window.html2pdf);
    const fill = ctx => { box.innerHTML = `<div class="card">${jobHtml(ctx)}</div>`; };
    const render = async ctx => {
      fill(ctx);
      return await html2pdf().set({ margin: [10, 8, 10, 8], image: { type: "jpeg", quality: 0.95 }, html2canvas: { scale: 2, useCORS: true, scrollY: 0 }, jsPDF: { unit: "mm", format: "a4", orientation: "portrait" }, pagebreak: { mode: ["css", "legacy"], avoid: ["tr", "h2", "h3", "h4", ".para"] } }).from(box).outputPdf("blob");
    };
    const canvas = async ctx => { fill(ctx); return await html2pdf().set({ html2canvas: { scale: 2, useCORS: true, scrollY: 0, backgroundColor: "#ffffff" } }).from(box).toCanvas().get("canvas"); };
    return await fn(render, prog, canvas);
  } finally { wrap.remove(); }
}
async function renderMerged(ctxs, render, prog, label, offset, total) {
  const bl = [];
  for (let i = 0; i < ctxs.length; i++) { prog(`${label} PDF를 만드는 중입니다… (${offset + i + 1}/${total})`); bl.push(await render(ctxs[i])); }
  if (bl.length === 1) return bl[0];
  prog(`${label} 한 파일로 합치는 중…`); return await mergePdfs(bl);
}
const jobName = (c0, suffix) => `${safeName(c0.name)}_${safeName(c0.school)}_${safeName(stuIdText(c0))}_${suffix}`;
async function makePdf(ctxs, name) {
  if (!ctxs.length) return;
  name = name || jobName(ctxs[0].stu, ctxs[0].html ? "탐구보고서.pdf" : "고교학점제.pdf");
  try { saveBlob(await pdfSession((render, prog) => renderMerged(ctxs, render, prog, "", 0, ctxs.length)), name); }
  catch (err) {
    alert("PDF 변환 도구를 불러오지 못했습니다(인터넷 연결 확인). 인쇄 창에서 'PDF로 저장'을 선택해 주세요.");
    const w = window.open("", "_blank");
    if (w) { w.document.write(`<!doctype html><meta charset=utf-8><title>${esc(name)}</title><style>${document.querySelector("style").textContent}</style>` + ctxs.map((c, i) => `<div class="card" style="${i ? "page-break-before:always" : ""}">${jobHtml(c)}</div>`).join("")); w.document.close(); setTimeout(() => w.print(), 400); }
  }
}
/* 이미지: 긴 결과지를 A4 비율로 잘라 JPEG 여러 장으로 만듭니다 */
async function makeImages(ctx, baseName) {
  const blobs = await pdfSession(async (render, prog, canvas) => {
    prog("이미지를 만드는 중입니다…");
    const c = await canvas(ctx);
    const pageH = Math.round(c.width * 1.4142), out = [];
    for (let y = 0; y < c.height; y += pageH) {
      const h = Math.min(pageH, c.height - y);
      if (h < 40 && out.length) break;
      const p = document.createElement("canvas"); p.width = c.width; p.height = pageH;
      const g = p.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, p.width, p.height); g.drawImage(c, 0, y, c.width, h, 0, 0, c.width, h);
      out.push(await new Promise(ok => p.toBlob(ok, "image/jpeg", 0.92)));
    }
    return out;
  });
  const files = blobs.map((b, i) => new File([b], `${baseName}_${i + 1}.jpg`, { type: "image/jpeg" }));
  S.imgs = { files, urls: files.map(f => URL.createObjectURL(f)), base: baseName };
}

async function makeZip(groups, name) {
  const total = groups.reduce((a, g) => a + g.classes.reduce((b, c) => b + exportable(c.items).length, 0), 0);
  if (!total) { alert("내보낼 제출 내역이 없습니다."); return; }
  try {
    const blob = await pdfSession(async (render, prog) => {
      await loadScript(LIB.pdflib, () => window.PDFLib); await loadScript(LIB.jszip, () => window.JSZip);
      const zip = new JSZip(); let n = 0;
      zip.file("명단.csv", csvOf(exportable(groups.flatMap(schoolItems))));
      for (const g of groups) for (const c of g.classes) {
        const items = exportable(c.items); if (!items.length) continue;
        const pdf = await renderMerged(items.map(subCtx), render, prog, `${g.name} ${c.label}`, n, total); n += items.length;
        zip.file(`${safeName(g.name)}/${safeName(c.label)}_결과지.pdf`, pdf);
      }
      prog("압축하는 중…"); return await zip.generateAsync({ type: "blob" });
    });

}

    try { await navigator.share({ files: S.imgs.files, title: S.imgs.base }); } catch (err) { if (err.name !== "AbortError") alert("공유 창을 열지 못했습니다. 사진을 길게 눌러 저장하거나 '파일로 내려받기'를 이용하세요."); }
    return;
  }
  else if (a === "img-dl") { S.imgs.files.forEach((f, i) => setTimeout(() => saveBlob(f, f.name), i * 350)); return; }
  else if (a === "img-close") { closeImgs(); }
  else if (a === "submit") {
    if (S.netErr) { alert("서버에 연결되지 않아 제출할 수 없습니다. 새로고침 후 다시 시도해 주세요."); return; }
    try {
      if (S.view === "rpt") {
        const r = S.rpt, o = {}; Object.keys(r).forEach(k => o[k] = String(r[k]).trim());
        await store.set("reports", { ...o, ban: +o.ban, no: +o.no, createdAt: Date.now() }); S.rptSaved = true;
      } else {
        const es = entries(), st = S.stu;
        const result = es.map(e => e.free ? { rank: e.r, school: "자유선택(학교 미정)", free: true, total: null, need: null, picks: ["2-1", "2-2", "3-1", "3-2"].flatMap(k => freeNames(e.ri, k).map(n => `${k} ${n}`)) }
          : (c => ({ rank: e.r, school: e.sc.name, total: c.total, need: c.need, picks: c.chosen.map(o => `${o.g}-${o.s} ${o.name}`) }))(calc(e.sc)));
        const snap = es.map(e => e.free ? { rank: e.r, school: null, free: cleanFree(e.ri), sel: {} }
          : { rank: e.r, school: { id: e.sc.id, name: e.sc.name, type: e.sc.type || "", sido: e.sc.sido || "", sigungu: e.sc.sigungu || e.sc.region || "", nationwide: !!e.sc.nationwide, region: e.sc.region || "", totalCredits: e.sc.totalCredits ?? 192, activityCredits: e.sc.activityCredits ?? 18, fixed: e.sc.fixed || [], slots: e.sc.slots || [] }, sel: S.sel[e.sc.id] || {} });
        await store.set("submissions", { name: st.name.trim(), school: st.school.trim(), grade: st.grade, ban: +st.ban, no: +st.no, sno: `${st.ban}반 ${st.no}번`, sido: st.sido, sigungu: st.sigungu, track: st.track, major: st.major, createdAt: Date.now(), result, snap }); S.saved = true;
      }
    } catch (err) { alert("제출에 실패했습니다: " + err.message); return; }
  }
  else if (a === "pdf-sub") { const x = S.admin.subs.find(y => y.id === d.id); await makePdf([subCtx(x)]); return; }
  else if (a === "pdf-class" || a === "pdf-school") {
    const g = groupSubs()[+d.si]; const c = a === "pdf-class" ? g.classes[+d.bi] : null;
    const items = exportable(c ? c.items : schoolItems(g));
    if (!items.length) { alert("내보낼 제출 내역이 없습니다."); return; }
    await makePdf(items.map(subCtx), `${safeName(g.name)}_${c ? safeName(c.label) : "전체"}_결과지.pdf`); return;
  }
  else if (a === "zip-school") { const g = groupSubs()[+d.si]; await makeZip([g], `${safeName(g.name)}_반별_결과지.zip`); return; }
  else if (a === "zip-all") { await makeZip(groupSubs(), "고교학점제_결과지_학교반별.zip"); return; }
  else if (a === "csv-all" || a === "csv-school" || a === "csv-class") {
    const gs = groupSubs(); let items, nm = "전체";
    if (a === "csv-all") items = gs.flatMap(schoolItems);
    else { const g = gs[+d.si]; nm = safeName(g.name); if (a === "csv-class") { items = g.classes[+d.bi].items; nm += "_" + safeName(g.classes[+d.bi].label); } else items = schoolItems(g); }
    saveBlob(new Blob([csvOf(exportable(items))], { type: "text/csv;charset=utf-8" }), `고교학점제_명단_${nm}.csv`); return;
  }
  else if (a === "close-pv") { S.admin.preview = null; }
  else if (a === "view-sub") { S.admin.preview = S.admin.preview === d.id ? null : d.id; }
  else if (a === "reload-rpts") { await loadAdminData(); }
  else if (a === "view-rpt") { S.admin.rpreview = d.id; }
  else if (a === "close-rpv") { S.admin.rpreview = null; }
  else if (a === "rpdf") { await makePdf([rptJob(S.admin.rpts.find(y => y.id === d.id))]); return; }
  else if (a === "rpdf-all" || a === "rzip" || a === "rcsv") {
    const old = oldIdSet(S.admin.rpts), items = rptFiltered().filter(x => !old.has(x.id)).sort((x, y) => normSchool(x.school).localeCompare(normSchool(y.school), "ko") || String(x.grade).localeCompare(String(y.grade)) || ((x.ban || 0) - (y.ban || 0)) || ((x.no || 0) - (y.no || 0)));
    const f = S.admin.rf, nm = [f.school, f.grade, f.ban ? f.ban + "반" : ""].filter(Boolean).map(safeName).join("_") || "전체";
    if (!items.length) { alert("내보낼 제출 내역이 없습니다."); return; }
    if (a === "rcsv") saveBlob(new Blob([csvRpt(items)], { type: "text/csv;charset=utf-8" }), `탐구보고서_${nm}.csv`);
    else if (a === "rzip") await makeRptZip(items, `탐구보고서_${nm}.zip`);
    else await makePdf(items.map(rptJob), `탐구보고서_${nm}_합본.pdf`);
    return;
  }
  else if (a === "del-rpt") { S.admin.rpreview = null; if (confirm("삭제할까요?")) { await store.del("reports", d.id); S.admin.rpts = S.admin.rpts.filter(x => x.id !== d.id); } }
  else if (a === "login") {
    try {
      if (store.mode === "firebase") await store.auth.signInWithEmailAndPassword($("#aEmail").value, $("#aPw").value);
      else {
        const pw = $("#aPw").value;
        if (!adminPw()) {
          if (pw.length < 4) throw new Error("암호는 4자 이상이어야 합니다.");
          if (pw !== $("#aPw2").value) throw new Error("두 암호가 같지 않습니다.");
          try { localStorage.setItem("hs_adminpw", await sha(pw)); } catch (_) { throw new Error("이 브라우저에 암호를 저장할 수 없습니다."); }
        } else if ((await sha(pw)) !== adminPw()) throw new Error("암호가 맞지 않습니다.");
      }
      await loadAdminData(); S.admin.ok = true; S.admin.msg = "";
    } catch (err) { S.admin.msg = "로그인 실패: " + err.message; }
  }
  else if (a === "atab") { S.admin.tab = d.k; S.admin.edit = null; }
  else if (a === "new-school") { S.admin.edit = newEdit(); }
  else if (a === "edit-school") { const x = S.schools.find(y => y.id === d.id); S.admin.edit = { ...newEdit(), id: x.id, name: x.name, type: x.type || "일반고", sido: x.sido || "", sigungu: x.sigungu ?? x.region ?? "", nationwide: !!x.nationwide, totalCredits: x.totalCredits ?? 192, activityCredits: x.activityCredits ?? 18, fixed: JSON.parse(JSON.stringify(x.fixed || [])).map(f => ({ kind: "", ...f })), slots: JSON.parse(JSON.stringify(x.slots || [])) }; }
  else if (a === "semtab") { const E = S.admin.edit; E.semTab = d.k; E.mode = "form"; E.bulk = null; }
  else if (a === "edtext") { const E = S.admin.edit; E.spec = toSpec(E); E.mode = "text"; }
  else if (a === "apply-spec") { const E = S.admin.edit; const p = parseSpec($("#edSpec").value); if (p.errs.length) { alert(p.errs.join("\n")); return; } E.fixed = p.fixed; E.slots = p.slots; E.mode = "form"; }
  else if (a === "add-fixed") { S.admin.edit.fixed.push({ g: +d.g, s: +d.s, name: "", credits: 4, kind: "일반" }); }
  else if (a === "del-fixed") { S.admin.edit.fixed.splice(+d.i, 1); }
  else if (a === "add-slot") { const E = S.admin.edit; E.slots.push({ g: +d.g, s: +d.s, label: "선택군" + (E.slots.filter(x => x.g === +d.g && x.s === +d.s).length + 1), pick: 1, options: [{ name: "", credits: 3, kind: "일반" }] }); }
  else if (a === "del-slot") { if (confirm("이 선택군을 삭제할까요?")) S.admin.edit.slots.splice(+d.i, 1); }
  else if (a === "add-opt") { const o = S.admin.edit.slots[+d.i].options; o.push({ name: "", credits: o.length ? o[o.length - 1].credits : 3, kind: "일반" }); }
  else if (a === "del-opt") { S.admin.edit.slots[+d.i].options.splice(+d.j, 1); }
  else if (a === "bulk-open") { const E = S.admin.edit; E.bulk = E.bulk === +d.i ? null : +d.i; }
  else if (a === "bulk-apply") {
    const sl = S.admin.edit.slots[+d.i];
    sl.options = sl.options.filter(o => String(o.name).trim());
    $("#bulkTxt").value.split("\n").map(x => x.trim()).filter(Boolean).forEach(l => {
      const tk = l.split(/[,\t|]/).map(x => x.trim()).filter(Boolean); if (!tk.length) return;
      let kind = "일반", cr = sl.options.length ? sl.options[sl.options.length - 1].credits : 3;
      tk.slice(1).forEach(t => { if (KINDS.includes(t)) kind = t; else if (!isNaN(parseFloat(t))) cr = parseFloat(t); });
      sl.options.push({ name: tk[0], credits: cr, kind });
    });
    S.admin.edit.bulk = null;
  }
  else if (a === "ai-run") { await aiExtract(); return; }
  else if (a === "load-samples") { for (const x of sampleSchools()) await store.set("schools", x); S.schools = await store.list("schools"); alert("예시 학교를 불러왔습니다."); }
  else if (a === "cancel-edit") { S.admin.edit = null; }
  else if (a === "save-school") {
    const E = S.admin.edit; const st = edStats(E);
    if (!E.name.trim()) { alert("학교명을 입력하세요."); return; }
    if (!E.sido || !String(E.sigungu).trim()) { alert("지역(시·도, 시·군·구)을 입력하세요."); return; }
    if (st.errs.length) { alert("확인이 필요합니다.\n" + st.errs.join("\n")); return; }
    const gu = String(E.sigungu).trim();
    await store.set("schools", { id: E.id, name: E.name.trim(), type: E.type, sido: E.sido, sigungu: gu, region: gu, nationwide: !!E.nationwide, totalCredits: +E.totalCredits, activityCredits: +E.activityCredits,
      fixed: E.fixed.map(f => ({ g: f.g, s: f.s, name: f.name.trim(), credits: +f.credits, kind: f.kind || "" })),
      slots: E.slots.map(x => ({ g: x.g, s: x.s, label: String(x.label).trim() || "선택군", pick: +x.pick, options: x.options.map(o => ({ name: o.name.trim(), credits: +o.credits, kind: o.kind || "" })) })) });
    S.schools = await store.list("schools"); S.admin.edit = null;
  }
  else if (a === "del-school") { if (confirm("이 학교를 삭제할까요?")) { await store.del("schools", d.id); S.schools = await store.list("schools"); } }
  else if (a === "save-careers") { await store.set("settings", { id: "careers", text: $("#careerTxt").value }); S.careersText = $("#careerTxt").value; alert("저장했습니다."); }
  else if (a === "reload-subs") { await loadAdminData(); }
  else if (a === "del-sub") { S.admin.preview = null; if (confirm("삭제할까요?")) { await store.del("submissions", d.id); S.admin.subs = S.admin.subs.filter(x => x.id !== d.id); } }
  else if (a === "export") {
    const b = new Blob([JSON.stringify(S.schools, null, 1)], { type: "application/json" });
    const l = document.createElement("a"); l.href = URL.createObjectURL(b); l.download = "schools.json"; l.click();
  }
  render();
  if (TOP.has(a) || a === "restart" || a === "go-home" || a === "my-img") window.scrollTo(0, 0);
  autosave(true);
});
document.addEventListener("input", e => {
  const t = e.target, d = t.dataset;
  if (d.f !== undefined) { S.stu[d.f] = t.value; S.saved = false; const b = document.querySelector("[data-act=hnext]"); if (b && S.step === 1) b.disabled = !infoOk(); autosave(); }
  else if (d.rf !== undefined) {
    S.rpt[d.rf] = t.value; S.rptSaved = false;
    const c = document.querySelector(`[data-cnt="${d.rf}"]`); if (c) c.textContent = t.value.length + "자";
    const b = document.querySelector("[data-act=rnext]"); if (b && S.rstep === 1) b.disabled = !rptInfoOk();
    autosave();
  }
  else if (d.fr !== undefined) { freeOf(+d.fr)[d.fk][+d.fi] = t.value; S.saved = false; autosave(); }
  else if (d.aq !== undefined) { S.admin[d.aq].q = t.value; const p = t.selectionStart; render(); const n = document.querySelector(`[data-aq="${d.aq}"]`); n.focus(); n.setSelectionRange(p, p); }
  else if (d.ef) {
    const E = S.admin.edit; let v = t.value; if (d.num) v = v === "" ? "" : parseFloat(v);
    if (d.ef === "fixed") E.fixed[+d.i][d.k] = v; else if (d.ef === "slot") E.slots[+d.i][d.k] = v; else E.slots[+d.i].options[+d.j][d.k] = v;
    refreshEd();
  }
  else if (d.flt) { if (t.type === "checkbox") return; S.filter[d.flt] = t.value; }
  else if (d.e) { S.admin.edit[d.e] = t.type === "checkbox" ? t.checked : t.value; refreshEd(); }
});
document.addEventListener("change", async e => {
  const t = e.target, d = t.dataset;
  if (d.f !== undefined && t.tagName === "SELECT") { S.stu[d.f] = t.value; if (d.f === "sido") S.stu.sigungu = ""; S.saved = false; render(); autosave(true); }
  else if (d.rf !== undefined && t.tagName === "SELECT") { S.rpt[d.rf] = t.value; S.rptSaved = false; render(); autosave(true); }
  else if (d.fl) { const [k, f] = d.fl.split("."); S.admin[k][f] = t.value; render(); }
  else if (d.e === "sido") { render(); }
  else if (d.flt === "nation") { S.filter.nation = t.checked; render(); }
  else if (d.rank !== undefined) { S.ranks[+d.rank] = t.value; S.saved = false; render(); autosave(true); }
  else if (d.flt === "q") { render(); }
  else if (t.id === "imp") {
    const f = t.files[0]; if (!f) return;
    try {
      const arr = JSON.parse(await f.text());
      for (const s of arr) await store.set("schools", s);
      S.schools = await store.list("schools"); alert(arr.length + "개 학교를 불러왔습니다."); render();
    } catch (err) { alert("불러오기 실패: " + err.message); }
  }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && (e.target.id === "aPw" || e.target.id === "aPw2")) document.querySelector("[data-act=login]").click(); });

/* ---------- 시작 ---------- */
(async function boot() {
  try { await store.init(); } catch (e) { console.warn("Firebase 초기화 실패", e); store.mode = "local"; store.fs = null; S.netErr = true; }
  render();
})();
</script>
